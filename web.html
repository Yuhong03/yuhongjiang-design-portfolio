<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Design</title>
    <link rel="stylesheet" href="css/web.css">
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Julius+Sans+One&display=swap" rel="stylesheet">
    <meta name="description" content="Web Design works by Yuhong Jiang">
    <meta name="keywords" content="Web Design, Portfolio, Yuhong Jiang">
</head>

<body>
    <header class="page-title">
        <h1>Web Design</h1>
    </header>

    <section class="button-container">
        <a href="index.html" class="home-button">Home</a>
        <a href="contact.html" class="contact-button">Contact</a>
        <a href="allprojects.html" class="projects-button">Projects</a>
    </section>

    <main class="gallery">
        <figure>
            <img src="images/loop.png" alt="Web Design project Loop">
        </figure>
        <figure>
            <img src="images/loopstyle2.png" alt="Web Design project Loopstyle 2">
        </figure>
    </main>

    <footer>
        <p class="copyright">©2025 YUHONG. ALL RIGHT RESERVED</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var targets = [];
            var figures = document.querySelectorAll('.gallery figure');
            for (var i = 0; i < figures.length; i++) {
                figures[i].classList.add('reveal-on-scroll');
                targets.push(figures[i]);
            }
            var buttonContainer = document.querySelector('.button-container');
            if (buttonContainer) {
                buttonContainer.classList.add('reveal-on-scroll');
                targets.push(buttonContainer);
            }
            var footer = document.querySelector('footer');
            if (footer) {
                footer.classList.add('reveal-on-scroll');
                targets.push(footer);
            }

            var prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (prefersReduced || !('IntersectionObserver' in window)) {
                for (var j = 0; j < targets.length; j++) {
                    targets[j].classList.add('in-view');
                }
                return;
            }

            var observer = new IntersectionObserver(function(entries, obs) {
                for (var k = 0; k < entries.length; k++) {
                    var entry = entries[k];
                    if (entry.isIntersecting) {
                        entry.target.classList.add('in-view');
                        obs.unobserve(entry.target);
                    }
                }
            }, { root: null, rootMargin: '0px 0px -10% 0px', threshold: 0.1 });

            for (var m = 0; m < targets.length; m++) {
                observer.observe(targets[m]);
            }
        });
    </script>
    
</body>

</html>
